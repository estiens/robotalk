inherit_from: .rubocop_todo.yml

require:
  - rubocop

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - "db/**/*"
    - "config/**/*"
    - "script/**/*"
    - "bin/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 200

Metrics/BlockLength:
  Max: 30
  Exclude:
    - "spec/**/*"

Rails:
  Enabled: true

RSpec:
  Enabled: true

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5

RSpec/DescribedClass:
  Enabled: false

RSpec/InstanceVariable:
  Enabled: false

RSpec/MessageSpies:
  EnforcedStyle: receive

RSpec/StubbedMock:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

FactoryBot:
  Enabled: true

FactoryBot/CreateList:
  Enabled: false

FactoryBot/FactoryNameStyle:
  EnforcedStyle: string

Capybara:
  Enabled: true

Capybara/CurrentPathExpectation:
  Enabled: false

Performance:
  Enabled: true
